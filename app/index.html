<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#f5f7fb" />
    <title>HelpMate AI — Support</title>
    <style>
      :root {
        color-scheme: light;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        color: #17243b;
        background: #f5f7fb;
      }
      * { box-sizing: border-box; }
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; }
      main { width: min(100%, 720px); height: min(760px, calc(100vh - 48px)); min-height: 480px; display: flex; flex-direction: column; overflow: hidden; background: white; border: 1px solid #e4e9f2; border-radius: 20px; box-shadow: 0 20px 60px #25395712; }
      header { padding: 24px 28px; border-bottom: 1px solid #e9edf4; }
      h1 { margin: 0 0 5px; font-size: 1.2rem; }
      header p { margin: 0; color: #65728a; font-size: .92rem; }
      #messages { flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 14px; padding: 24px 28px; }
      .bubble { max-width: 82%; padding: 13px 16px; border-radius: 16px; line-height: 1.5; white-space: pre-wrap; overflow-wrap: anywhere; }
      .assistant { align-self: flex-start; background: #f0f3f9; border-bottom-left-radius: 5px; }
      .user { align-self: flex-end; color: white; background: #2456d3; border-bottom-right-radius: 5px; }
      form { display: flex; gap: 10px; padding: 18px 22px; border-top: 1px solid #e9edf4; }
      input { flex: 1; min-width: 0; padding: 13px 15px; border: 1px solid #dce3ee; border-radius: 12px; font: inherit; outline: none; }
      input:focus { border-color: #2456d3; box-shadow: 0 0 0 3px #2456d322; }
      button { padding: 0 20px; border: 0; border-radius: 12px; color: white; background: #2456d3; font: inherit; font-weight: 600; cursor: pointer; }
      button:disabled { opacity: .6; cursor: wait; }
      @media (max-width: 520px) { body { padding: 0; } main { height: 100dvh; min-height: 0; border: 0; border-radius: 0; } header { padding: 20px; } #messages { padding: 20px; } form { padding: 14px; } }
    </style>
  </head>
  <body>
    <main>
      <header>
        <h1>HelpMate AI</h1>
        <p>Ask a question about shipping, returns, or your order.</p>
      </header>
      <section id="messages" role="log" aria-live="polite" aria-label="Conversation">
        <div class="bubble assistant">Hi! I can help with common support questions. What would you like to know?</div>
      </section>
      <form id="chat-form">
        <input id="message-input" name="message" maxlength="2000" autocomplete="off" placeholder="Type your question…" aria-label="Your question" required />
        <button id="send-button" type="submit">Send</button>
      </form>
    </main>
    <script>
      const form = document.querySelector("#chat-form");
      const input = document.querySelector("#message-input");
      const button = document.querySelector("#send-button");
      const messages = document.querySelector("#messages");

      function addMessage(text, role) {
        const bubble = document.createElement("div");
        bubble.className = `bubble ${role}`;
        bubble.textContent = text;
        messages.append(bubble);
        messages.scrollTop = messages.scrollHeight;
      }

      form.addEventListener("submit", async (event) => {
        event.preventDefault();
        const message = input.value.trim();
        if (!message) return;
        addMessage(message, "user");
        input.value = "";
        button.disabled = true;
        try {
          const response = await fetch("/chat", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ message }),
          });
          const data = await response.json();
          if (!response.ok) throw new Error(data.detail || "The request could not be completed.");
          addMessage(data.answer, "assistant");
        } catch (error) {
          addMessage(`Sorry, I couldn't get an answer. ${error.message}`, "assistant");
        } finally {
          button.disabled = false;
          input.focus();
        }
      });
    </script>
  </body>
</html>
